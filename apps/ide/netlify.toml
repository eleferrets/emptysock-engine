[build]
  base    = "apps/ide"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9"

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Required for SharedArrayBuffer (used by esbuild-wasm worker)
    Cross-Origin-Opener-Policy  = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
