[package]
name = "app"
version = "0.1.0"
description = "EmptySock IDE — game development environment"
authors = ["EmptySock"]
license = "MIT"
repository = "https://github.com/eleferrets/emptysock-engine"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Native keyboard-layout query (src/keyboard_layout.rs). WKWebView and
# WebKitGTK lack navigator.keyboard.getLayoutMap(); WebView2 has it, so
# Windows needs nothing here.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = "0.7"
