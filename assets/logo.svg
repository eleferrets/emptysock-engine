<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#ff6ca8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d97ff"/>
      <stop offset="100%" stop-color="#ff97c8"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="160" cy="160" r="150" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>

  <!-- Socket holes -->
  <rect x="117" y="108" width="26" height="40" rx="13" fill="url(#accent)" filter="url(#blur)" opacity="0.5"/>
  <rect x="177" y="108" width="26" height="40" rx="13" fill="url(#accent)" filter="url(#blur)" opacity="0.5"/>
  <rect x="119" y="110" width="22" height="36" rx="11" fill="url(#glow)"/>
  <rect x="179" y="110" width="22" height="36" rx="11" fill="url(#glow)"/>

  <!-- Socket face plate -->
  <rect x="90" y="90" width="140" height="140" rx="20" fill="none" stroke="url(#accent)" stroke-width="3"/>
</svg>
