<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <style>
      .bg-fill { fill: #0f0f1a }
      .bg-fill-2 { stop-color: #0f0f1a }
      .bg-fill-3 { stop-color: #1a1a3e }
      .ring { opacity: 0.4 }
      .hole-glow { opacity: 0.55 }
      @media (prefers-color-scheme: light) {
        .bg-fill { fill: #f0efff }
        .bg-fill-2 { stop-color: #ece9ff }
        .bg-fill-3 { stop-color: #dcd7ff }
        .ring { opacity: 0.35 }
        .hole-glow { opacity: 0.4 }
      }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="bg-fill-2"/>
      <stop offset="100%" class="bg-fill-3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#ff6ca8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b52ee"/>
      <stop offset="100%" stop-color="#e85a96"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="148" fill="none" stroke="url(#accent)" stroke-width="2" class="ring"/>

  <rect x="117" y="108" width="26" height="40" rx="13" fill="url(#accent)" filter="url(#blur)" class="hole-glow"/>
  <rect x="177" y="108" width="26" height="40" rx="13" fill="url(#accent)" filter="url(#blur)" class="hole-glow"/>
  <rect x="119" y="110" width="22" height="36" rx="11" fill="url(#glow)"/>
  <rect x="179" y="110" width="22" height="36" rx="11" fill="url(#glow)"/>

  <rect x="90" y="90" width="140" height="140" rx="20" fill="none" stroke="url(#accent)" stroke-width="3"/>
</svg>
